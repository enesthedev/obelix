version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/Istanbul"
    cooldown:
      default-days: 3
      exclude:
        - "laravel/*"
    groups:
      composer-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/Istanbul"
    cooldown:
      default-days: 3
      exclude:
        - "@laravel/*"
        - "laravel-vite-plugin"
    # vite is an alias of vite-plus-core and the two only move together.
    # Dependabot can't do that, so they follow the starter kit (see upstream.yml).
    ignore:
      - dependency-name: "vite"
      - dependency-name: "vite-plus"
      - dependency-name: "@voidzero-dev/*"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
