version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/Istanbul"
    cooldown:
      default-days: 3
      exclude:
        - "laravel/*"
    groups:
      composer-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/Istanbul"
    cooldown:
      default-days: 3
      exclude:
        - "@laravel/*"
        - "laravel-vite-plugin"
    groups:
      # vite is an alias of vite-plus-core, so it has to move with vite-plus
      vite:
        patterns:
          - "vite"
          - "vite-plus"
          - "@voidzero-dev/*"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
